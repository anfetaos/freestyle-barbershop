<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Freestyle Barbershop</title>

<link rel="manifest" href="manifest.json">

<style>

:root{

  --bg:#0b0b0b;
  --d1:#111111;
  --d2:#181818;
  --d3:#202020;

  --gold:#d4af37;
  --cyan:#00c8ff;

  --txt:#f0f0f0;
  --muted:#888;

  --success:#1dd65f;
  --danger:#ff4b4b;

}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{

  background:var(--bg);
  color:var(--txt);

  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Segoe UI",
  sans-serif;

  min-height:100vh;
  overflow-x:hidden;

}

.screen{
  display:none;
  min-height:100vh;
}

.screen.on{
  display:block;
}

.topbar{

  height:60px;
  background:var(--d1);

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 16px;

  border-bottom:1px solid #222;

  position:sticky;
  top:0;
  z-index:100;

}

.logo{
  font-weight:700;
  font-size:18px;
}

.role{
  font-size:13px;
  color:var(--muted);
}

.wrap{
  padding:18px;
}

.card{

  background:var(--d2);
  border:1px solid #222;

  border-radius:18px;

  padding:16px;

  margin-bottom:16px;

}

.tt{
  font-size:17px;
  font-weight:700;
  margin-bottom:12px;
}

.grid{

  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;

}

.btn{

  height:52px;

  border:none;
  border-radius:14px;

  background:var(--gold);
  color:black;

  font-weight:700;
  cursor:pointer;

}

.btn2{

  height:52px;

  border:none;
  border-radius:14px;

  background:var(--d3);
  color:white;

  border:1px solid #333;

  cursor:pointer;

}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field label{
  font-size:13px;
  color:#aaa;
}

.field input,
.field select{

  height:48px;

  background:#101010;
  color:white;

  border:1px solid #2a2a2a;
  border-radius:12px;

  padding:0 14px;

}

.login-wrap{

  width:100%;
  max-width:380px;

  margin:auto;
  padding:24px;

  display:flex;
  flex-direction:column;
  gap:22px;

}

.login-logo{

  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;

  margin-top:40px;

}

.logo-circle{

  width:78px;
  height:78px;

  border-radius:50%;

  border:2px solid var(--gold);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:26px;
  font-weight:700;

  color:var(--gold);

}

.login-title{
  font-size:26px;
  font-weight:700;
}

.login-sub{
  color:var(--muted);
  font-size:13px;
}

.login-card{

  background:var(--d2);

  border:1px solid #222;

  border-radius:20px;

  padding:20px;

  display:flex;
  flex-direction:column;
  gap:14px;

}

.btn-login{

  height:50px;

  border:none;
  border-radius:14px;

  background:var(--gold);

  font-weight:700;
  cursor:pointer;

}

.login-error{

  min-height:18px;

  color:var(--danger);

  text-align:center;
  font-size:13px;

}

.kpi{

  background:#101010;
  border:1px solid #222;

  border-radius:16px;

  padding:14px;

}

.kpi-num{
  font-size:24px;
  font-weight:700;
}

.kpi-lb{
  font-size:12px;
  color:var(--muted);
}

.prod{

  background:#101010;
  border:1px solid #222;

  border-radius:16px;

  padding:14px;

  margin-bottom:12px;

}

.prod-top{

  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:10px;

}

.prod-name{
  font-weight:700;
}

.prod-cat{
  font-size:12px;
  color:var(--muted);
}

.badge{

  background:#202020;
  border:1px solid #333;

  padding:4px 8px;

  border-radius:999px;

  font-size:11px;

}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.sep{
  height:1px;
  background:#222;
  margin:14px 0;
}

.dot{

  width:10px;
  height:10px;

  border-radius:50%;

}

.connected{
  background:var(--success);
}

.disconnected{
  background:var(--danger);
}

.status{

  display:flex;
  align-items:center;
  gap:8px;

  font-size:13px;

}

</style>
</head>
<body>

<!-- LOGIN -->

<section id="sc-login" class="screen on">

  <div class="login-wrap">

    <div class="login-logo">

      <div class="logo-circle">
        FS
      </div>

      <div class="login-title">
        Freestyle
      </div>

      <div class="login-sub">
        Control de Barbería
      </div>

    </div>

    <div class="login-card">

      <div class="field">

        <label>Usuario</label>

        <input
          id="li-u"
          type="text"
          autocomplete="off"
        >

      </div>

      <div class="field">

        <label>Contraseña</label>

        <input
          id="li-p"
          type="password"
        >

      </div>

      <div
        id="li-err"
        class="login-error"
      ></div>

      <button
        class="btn-login"
        onclick="doLogin()"
      >
        Ingresar
      </button>

    </div>

  </div>

</section>

<!-- OWNER -->

<section id="sc-owner" class="screen">

  <div class="topbar">

    <div>

      <div class="logo">
        Freestyle
      </div>

      <div
        id="hdr-role"
        class="role"
      ></div>

    </div>

    <button
      class="btn2"
      style="width:110px;height:40px"
      onclick="doLogout()"
    >
      Salir
    </button>

  </div>

  <div class="wrap">

    <div class="card">

      <div class="status">

        <div
          id="sheets-dot"
          class="dot disconnected"
        ></div>

        <div id="sheets-status-txt">
          Sin conexión
        </div>

      </div>

    </div>

    <div class="grid">

      <div class="kpi">

        <div
          id="kpi-ventas"
          class="kpi-num"
        >
          $0
        </div>

        <div class="kpi-lb">
          Ventas
        </div>

      </div>

      <div class="kpi">

        <div
          id="kpi-gastos"
          class="kpi-num"
        >
          $0
        </div>

        <div class="kpi-lb">
          Gastos
        </div>

      </div>

    </div>

    <div class="card">

      <div class="tt">
        Cobrar Servicio
      </div>

      <div
        id="servicios-grid"
        class="grid"
      ></div>

    </div>

    <div class="card">

      <div class="row">

        <div class="tt">
          Productos
        </div>

        <button
          class="btn2"
          style="width:120px"
          onclick="agregarProductoPrompt()"
        >
          Agregar
        </button>

      </div>

      <div id="productos-wrap"></div>

    </div>

    <div class="card">

      <div class="tt">
        Costos Operativos
      </div>

      <div id="costos-wrap"></div>

    </div>

  </div>

</section>

<script>

/* ───────────────────────────── */

const SHEETS_URL =
'https://script.google.com/macros/s/AKfycbyVXijFTgUwIKKA9wxCoQ-McPeu3oSw2tzIKNmaliLDkmhY0RCHKbSqKA5Tj_TRjO3D6A/exec';

/* ───────────────────────────── */

let USERS      = {};
let SERVICIOS  = [];
let PRODUCTOS  = [];
let COSTOS     = {};
let CONFIG     = {};

let VENTAS     = [];
let GASTOS     = [];

let currentUser = null;

/* ───────────────────────────── */

function qs(id){
  return document.getElementById(id);
}

function fmt(n=0){
  return '$'+Number(n)
  .toLocaleString('es-CO');
}

/* ───────────────────────────── */

async function api(action,data={}){

  try{

    const res = await fetch(SHEETS_URL,{

      method:'POST',

      headers:{
        'Content-Type':'application/json'
      },

      body:JSON.stringify({
        action,
        data
      })

    });

    return await res.json();

  }catch(err){

    console.log(err);

    return {
      success:false
    };

  }

}

/* ───────────────────────────── */

async function cargarSistema(){

  try{

    const res =
    await fetch(
      SHEETS_URL+'?action=load'
    );

    const json =
    await res.json();

    if(!json.success){

      actualizarEstado(false);

      return;

    }

    USERS      = json.data.usuarios  || {};
    SERVICIOS  = json.data.servicios || [];
    PRODUCTOS  = json.data.productos || [];
    COSTOS     = json.data.costos    || {};
    CONFIG     = json.data.config    || {};
    VENTAS     = json.data.ventas    || [];
    GASTOS     = json.data.gastos    || [];

    actualizarEstado(true);

    renderServicios();
    renderProductos();
    renderCostos();
    renderKPIs();

  }catch(err){

    console.log(err);

    actualizarEstado(false);

  }

}

/* ───────────────────────────── */

function actualizarEstado(ok){

  const dot = qs('sheets-dot');
  const txt = qs('sheets-status-txt');

  if(ok){

    dot.className='dot connected';

    txt.innerHTML='Conectado';

  }else{

    dot.className='dot disconnected';

    txt.innerHTML='Sin conexión';

  }

}

/* ───────────────────────────── */

function renderKPIs(){

  let totalVentas = 0;
  let totalGastos = 0;

  VENTAS.forEach(x=>{
    totalVentas += Number(x.total || 0);
  });

  GASTOS.forEach(x=>{
    totalGastos += Number(x.monto || 0);
  });

  qs('kpi-ventas').innerHTML =
  fmt(totalVentas);

  qs('kpi-gastos').innerHTML =
  fmt(totalGastos);

}

/* ───────────────────────────── */

function renderServicios(){

  const wrap =
  qs('servicios-grid');

  wrap.innerHTML='';

  SERVICIOS
  .filter(x=>x.activo)
  .forEach(serv=>{

    const btn =
    document.createElement('button');

    btn.className='btn';

    btn.innerHTML=`
      ${serv.nombre}<br>
      ${fmt(serv.precio)}
    `;

    btn.onclick=()=>{

      cobrarServicio(serv);

    };

    wrap.appendChild(btn);

  });

}

/* ───────────────────────────── */

function renderProductos(){

  const wrap =
  qs('productos-wrap');

  wrap.innerHTML='';

  PRODUCTOS.forEach(prod=>{

    const div =
    document.createElement('div');

    div.className='prod';

    div.innerHTML=`

      <div class="prod-top">

        <div>

          <div class="prod-name">
            ${prod.nom}
          </div>

          <div class="prod-cat">
            ${prod.cat}
          </div>

        </div>

        <div class="badge">
          Stock ${prod.stock}
        </div>

      </div>

      <div class="row">

        <div>
          Costo:
          ${fmt(prod.costo)}
        </div>

        <div>
          Venta:
          ${fmt(prod.venta)}
        </div>

      </div>

    `;

    wrap.appendChild(div);

  });

}

/* ───────────────────────────── */

function renderCostos(){

  const wrap =
  qs('costos-wrap');

  wrap.innerHTML='';

  Object.keys(COSTOS)
  .forEach(key=>{

    const div =
    document.createElement('div');

    div.className='prod';

    div.innerHTML=`

      <div class="row">

        <div>
          ${key}
        </div>

        <div>
          ${fmt(COSTOS[key])}
        </div>

      </div>

    `;

    wrap.appendChild(div);

  });

}

/* ───────────────────────────── */

function doLogin(){

  const u =
  qs('li-u').value.trim();

  const p =
  qs('li-p').value.trim();

  const usr =
  USERS[u];

  if(!usr){

    qs('li-err').innerHTML =
    'Usuario inválido';

    return;

  }

  if(!usr.activo){

    qs('li-err').innerHTML =
    'Usuario desactivado';

    return;

  }

  if(usr.pass !== p){

    qs('li-err').innerHTML =
    'Contraseña incorrecta';

    return;

  }

  currentUser = usr;

  qs('hdr-role').innerHTML =
  usr.nombre;

  openScreen('sc-owner');

}

/* ───────────────────────────── */

function doLogout(){

  currentUser = null;

  openScreen('sc-login');

}

/* ───────────────────────────── */

function openScreen(id){

  document
  .querySelectorAll('.screen')
  .forEach(x=>x.classList.remove('on'));

  qs(id).classList.add('on');

}

/* ───────────────────────────── */

async function cobrarServicio(serv){

  if(!currentUser)return;

  const data = {

    fecha:new Date().toISOString(),

    usuario:currentUser.nombre,

    servicio:serv.nombre,

    codigo:serv.codigo,

    total:serv.precio

  };

  const r =
  await api(
    'guardarVenta',
    data
  );

  if(r.success){

    alert('Servicio cobrado');

    await cargarSistema();

  }

}

/* ───────────────────────────── */

async function agregarProductoPrompt(){

  const nom =
  prompt('Nombre producto');

  if(!nom)return;

  const cat =
  prompt('Categoría');

  const costo =
  Number(prompt('Costo'));

  const venta =
  Number(prompt('Precio venta'));

  const stock =
  Number(prompt('Stock'));

  const r =
  await api(
    'guardarProducto',
    {
      nom,
      cat,
      costo,
      venta,
      stock
    }
  );

  if(r.success){

    alert('Producto agregado');

    cargarSistema();

  }

}

/* ───────────────────────────── */

(async()=>{

  await cargarSistema();

  setInterval(
    cargarSistema,
    15000
  );

})();

</script>

</body>
</html>
