<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
/>

<title>Freestyle Barbershop</title>

<link rel="manifest" href="manifest.json"/>

<style>

:root{

  --bg:#050816;

  --d1:#0c1026;
  --d2:#111831;
  --d3:#182347;

  --blue:#3ea6ff;
  --blue2:#66c3ff;

  --gold:#d6b06a;

  --txt:#f5f7ff;
  --muted:#8d9ab8;

  --success:#1dd65f;
  --danger:#ff4e4e;

}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{

  background:
  linear-gradient(
    180deg,
    #060a1a,
    #09112a
  );

  color:var(--txt);

  font-family:
  -apple-system,
  BlinkMacSystemFont,
  "Segoe UI",
  sans-serif;

  min-height:100vh;

}

/* LOGIN */

.login{

  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:24px;

}

.login-box{

  width:100%;
  max-width:400px;

  background:
  linear-gradient(
    180deg,
    rgba(17,24,49,.95),
    rgba(12,16,38,.96)
  );

  border:1px solid #26355f;

  border-radius:28px;

  overflow:hidden;

  box-shadow:
  0 0 30px rgba(0,0,0,.5);

}

.login-cover{

  height:220px;

  background-image:
  url('https://raw.githubusercontent.com/anfetaos/freestyle-barbershop/main/logo.jpg');

  background-size:cover;
  background-position:center;

  position:relative;

}

.login-cover::after{

  content:'';

  position:absolute;
  inset:0;

  background:
  linear-gradient(
    180deg,
    rgba(0,0,0,.15),
    rgba(0,0,0,.65)
  );

}

.login-brand{

  position:absolute;

  bottom:14px;
  left:16px;

  z-index:2;

}

.brand-title{

  font-size:28px;
  font-weight:800;

  color:white;

  text-shadow:
  0 2px 12px rgba(0,0,0,.5);

}

.brand-sub{

  font-size:12px;
  color:#d9e9ff;

  letter-spacing:2px;

}

.login-form{

  padding:22px;

  display:flex;
  flex-direction:column;
  gap:14px;

}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.field label{

  font-size:13px;
  color:var(--muted);

}

.field input{

  height:50px;

  border:none;
  outline:none;

  border-radius:14px;

  background:#0b1228;

  border:1px solid #273860;

  color:white;

  padding:0 14px;

}

.login-btn{

  height:52px;

  border:none;
  border-radius:16px;

  background:
  linear-gradient(
    90deg,
    var(--blue),
    var(--blue2)
  );

  color:#08111f;

  font-weight:800;

  cursor:pointer;

  margin-top:4px;

}

.login-error{

  min-height:18px;

  color:var(--danger);

  text-align:center;

  font-size:13px;

}

/* APP */

.screen{
  display:none;
}

.screen.on{
  display:block;
}

.topbar{

  height:68px;

  background:
  rgba(10,16,37,.92);

  backdrop-filter:blur(10px);

  border-bottom:1px solid #26355f;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 16px;

  position:sticky;
  top:0;
  z-index:100;

}

.top-title{

  font-weight:800;
  font-size:20px;

  color:var(--blue2);

}

.top-user{

  font-size:12px;
  color:var(--muted);

}

.wrap{
  padding:18px;
}

.card{

  background:
  linear-gradient(
    180deg,
    rgba(18,25,52,.92),
    rgba(12,17,37,.95)
  );

  border:1px solid #26355f;

  border-radius:22px;

  padding:16px;

  margin-bottom:16px;

}

.tt{

  font-size:17px;
  font-weight:700;

  margin-bottom:14px;

}

.grid{

  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;

}

.btn{

  min-height:72px;

  border:none;
  border-radius:18px;

  background:
  linear-gradient(
    135deg,
    var(--blue),
    #285bff
  );

  color:white;

  font-weight:700;

  padding:10px;

  cursor:pointer;

}

.kpi{

  background:#0b1228;

  border:1px solid #25345c;

  border-radius:18px;

  padding:16px;

}

.kpi-num{

  font-size:28px;
  font-weight:800;

}

.kpi-lb{

  font-size:12px;
  color:var(--muted);

}

.prod{

  background:#0b1228;

  border:1px solid #25345c;

  border-radius:18px;

  padding:14px;

  margin-bottom:12px;

}

.row{

  display:flex;
  justify-content:space-between;
  align-items:center;

}

.prod-name{
  font-weight:700;
}

.prod-cat{

  font-size:12px;
  color:var(--muted);

}

.badge{

  padding:4px 8px;

  border-radius:999px;

  font-size:11px;

  background:#172244;

  border:1px solid #324a81;

}

.logout{

  border:none;

  background:#182347;

  color:white;

  border:1px solid #2f4374;

  border-radius:12px;

  padding:10px 14px;

}

</style>
</head>
<body>

<!-- LOGIN -->

<section
  id="sc-login"
  class="login"
>

  <div class="login-box">

    <div class="login-cover">

      <div class="login-brand">

        <div class="brand-title">
          Freestyle
        </div>

        <div class="brand-sub">
          URBAN GROOMING
        </div>

      </div>

    </div>

    <div class="login-form">

      <div class="field">

        <label>Usuario</label>

        <input
          id="li-u"
          type="text"
        />

      </div>

      <div class="field">

        <label>Contraseña</label>

        <input
          id="li-p"
          type="password"
        />

      </div>

      <div
        id="li-err"
        class="login-error"
      ></div>

      <button
        class="login-btn"
        onclick="doLogin()"
      >
        INGRESAR
      </button>

    </div>

  </div>

</section>

<!-- APP -->

<section
  id="sc-app"
  class="screen"
>

  <div class="topbar">

    <div>

      <div class="top-title">
        Freestyle
      </div>

      <div
        id="top-user"
        class="top-user"
      ></div>

    </div>

    <button
      class="logout"
      onclick="logout()"
    >
      Salir
    </button>

  </div>

  <div class="wrap">

    <!-- KPIs -->

    <div class="grid">

      <div class="kpi">

        <div
          id="kpi-ventas"
          class="kpi-num"
        >
          $0
        </div>

        <div class="kpi-lb">
          Ventas
        </div>

      </div>

      <div class="kpi">

        <div
          id="kpi-citas"
          class="kpi-num"
        >
          0
        </div>

        <div class="kpi-lb">
          Citas
        </div>

      </div>

    </div>

    <!-- SERVICIOS -->

    <div class="card">

      <div class="tt">
        Servicios
      </div>

      <div
        id="servicios-grid"
        class="grid"
      ></div>

    </div>

    <!-- PRODUCTOS -->

    <div class="card">

      <div class="tt">
        Productos
      </div>

      <div id="productos-wrap"></div>

    </div>

  </div>

</section>

<script>

const SHEETS_URL =
'https://script.google.com/macros/s/AKfycbyVXijFTgUwIKKA9wxCoQ-McPeu3oSw2tzIKNmaliLDkmhY0RCHKbSqKA5Tj_TRjO3D6A/exec';

let DB = {};

let currentUser = null;

/* HELPERS */

function qs(id){
  return document.getElementById(id);
}

function money(n=0){

  return '$'+
  Number(n)
  .toLocaleString('es-CO');

}

/* LOAD */

async function loadDB(){

  const r =
  await fetch(
    SHEETS_URL+'?action=load'
  );

  const j =
  await r.json();

  if(!j.success){

    alert('Error Sheets');
    return;

  }

  DB = j.data;

  renderServicios();
  renderProductos();
  renderKPIs();

}

/* LOGIN */

function doLogin(){

  const u =
  qs('li-u').value.trim();

  const p =
  qs('li-p').value.trim();

  const user =
  DB.usuarios[u];

  if(!user){

    qs('li-err').innerHTML =
    'Usuario inválido';

    return;

  }

  if(!user.activo){

    qs('li-err').innerHTML =
    'Usuario inactivo';

    return;

  }

  if(
    String(user.pass) !==
    String(p)
  ){

    qs('li-err').innerHTML =
    'Contraseña incorrecta';

    return;

  }

  currentUser = user;

  qs('top-user').innerHTML =
  user.nombre;

  qs('sc-login').style.display='none';

  qs('sc-app').classList.add('on');

}

/* LOGOUT */

function logout(){

  currentUser = null;

  qs('sc-login').style.display='flex';

  qs('sc-app').classList.remove('on');

}

/* KPIS */

function renderKPIs(){

  let ventas = 0;

  DB.ventas.forEach(v=>{

    ventas +=
    Number(v.valor || 0);

  });

  qs('kpi-ventas').innerHTML =
  money(ventas);

  qs('kpi-citas').innerHTML =
  DB.citas.length;

}

/* SERVICIOS */

function renderServicios(){

  const wrap =
  qs('servicios-grid');

  wrap.innerHTML='';

  DB.servicios
  .filter(s=>s.activo)
  .forEach(serv=>{

    const btn =
    document.createElement('button');

    btn.className='btn';

    btn.innerHTML=`

      <div>
        ${serv.nombre}
      </div>

      <div>
        ${money(serv.precio)}
      </div>

    `;

    btn.onclick=()=>{

      cobrarServicio(serv);

    };

    wrap.appendChild(btn);

  });

}

/* PRODUCTOS */

function renderProductos(){

  const wrap =
  qs('productos-wrap');

  wrap.innerHTML='';

  DB.productos
  .filter(p=>p.activo)
  .forEach(prod=>{

    const div =
    document.createElement('div');

    div.className='prod';

    div.innerHTML=`

      <div class="row">

        <div>

          <div class="prod-name">
            ${prod.nom}
          </div>

          <div class="prod-cat">
            ${prod.cat}
          </div>

        </div>

        <div class="badge">
          Stock ${prod.stock}
        </div>

      </div>

      <div
        class="row"
        style="margin-top:10px"
      >

        <div>
          ${money(prod.costo)}
        </div>

        <div>
          ${money(prod.venta)}
        </div>

      </div>

    `;

    wrap.appendChild(div);

  });

}

/* COBRAR */

async function cobrarServicio(serv){

  if(!currentUser)return;

  const body = {

    action:'guardarVenta',

    data:{

      tipo:'servicio',

      item_id:serv.id,

      item_nombre:serv.nombre,

      valor:serv.precio,

      cantidad:1,

      usuario:currentUser.usuario

    }

  };

  const r =
  await fetch(SHEETS_URL,{

    method:'POST',

    headers:{
      'Content-Type':'application/json'
    },

    body:JSON.stringify(body)

  });

  const j =
  await r.json();

  if(j.success){

    alert('Venta registrada');

    await loadDB();

  }

}

/* INIT */

(async()=>{

  await loadDB();

})();

</script>

</body>
</html>
